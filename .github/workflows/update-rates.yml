name: update-rates

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates-updater
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live rates from tgju
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, sys
          URL = 'https://call.tgju.org/ajax.json'
          KEYS = ['geram18', 'price_dollar_rl', 'price_eur', 'mesghal', 'ons']
          data = None
          last = None
          for i in range(4):
              try:
                  req = urllib.request.Request(URL, headers={'User-Agent': 'Mozilla/5.0'})
                  data = json.loads(urllib.request.urlopen(req, timeout=45).read().decode('utf-8'))
                  break
              except Exception as e:
                  last = e
                  time.sleep(6)
          if data is None:
              sys.exit('fetch failed: %r' % last)
          cur = data.get('current') or {}
          items = {}
          for k in KEYS:
              v = cur.get(k) or {}
              p = str(v.get('p') or '').replace(',', '').strip()
              if not p:
                  continue
              items[k] = {'p': float(p), 'dp': v.get('dp'), 'd': v.get('d'), 'ts': v.get('ts')}
          if not items:
              sys.exit('no prices parsed')
          out = {'items': items, 'fetched': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}
          with open('rates.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False))
          PY

      - name: Commit rates.json
        run: |
          git config user.name "rates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          if git diff --cached --quiet; then
            echo "no price change"
            exit 0
          fi
          git commit -m "rates $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
